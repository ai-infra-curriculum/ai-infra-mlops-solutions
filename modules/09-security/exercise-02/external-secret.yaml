# Kubernetes-side: External Secrets Operator syncs from Vault → Secret.
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata: { name: vault-backend }
spec:
  provider:
    vault:
      server: "https://vault.internal:8200"
      path: "kv"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-reader"
          serviceAccountRef: { name: "external-secrets", namespace: "external-secrets" }
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: { name: iris-api, namespace: iris }
spec:
  refreshInterval: 15m
  secretStoreRef: { name: vault-backend, kind: ClusterSecretStore }
  target: { name: iris-api-secrets, creationPolicy: Owner }
  data:
    - { secretKey: DATABASE_URL,  remoteRef: { key: ml-platform/iris-api/db, property: url } }
    - { secretKey: OPENAI_API_KEY, remoteRef: { key: ml-platform/iris-api/openai, property: api_key } }
