# Argo Rollouts with auto-analysis on success rate.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata: { name: recs }
spec:
  replicas: 8
  selector: { matchLabels: { app: recs } }
  template:
    metadata: { labels: { app: recs } }
    spec: { containers: [{ name: api, image: ghcr.io/me/recs:0.6 }] }
  strategy:
    canary:
      steps:
        - setWeight: 5
        - pause: { duration: 5m }
        - analysis: { templates: [{ templateName: success-rate }] }
        - setWeight: 25
        - pause: { duration: 10m }
        - analysis: { templates: [{ templateName: success-rate }] }
        - setWeight: 50
        - pause: { duration: 15m }
        - setWeight: 100
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata: { name: success-rate }
spec:
  metrics:
    - name: success-rate
      provider:
        prometheus:
          address: http://prometheus:9090
          query: |
            sum(rate(http_requests_total{job="recs",status!~"5.."}[5m]))
              /
            sum(rate(http_requests_total{job="recs"}[5m]))
      successCondition: result[0] >= 0.99
      failureLimit: 1
