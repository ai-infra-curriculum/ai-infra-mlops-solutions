# Istio progressive rollout: gradual 5% → 25% → 50% → 100%.
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata: { name: recs }
spec:
  hosts: [recs]
  http:
    - route:
        - { destination: { host: recs, subset: v1 }, weight: 95 }
        - { destination: { host: recs, subset: v2 }, weight: 5 }
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata: { name: recs }
spec:
  host: recs
  subsets:
    - { name: v1, labels: { version: "v1" } }
    - { name: v2, labels: { version: "v2" } }
