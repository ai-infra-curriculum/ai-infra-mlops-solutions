global: { resolve_timeout: 5m }
route:
  group_by: [alertname, model]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  receiver: slack-warnings
  routes:
    - matchers: [severity = "critical"]
      receiver: pagerduty-and-slack
  inhibit_rules:
    - source_matchers: [alertname = "ModelDataPipelineStalled"]
      target_matchers: [alertname = "ModelAccuracyRegression"]
      equal: [model]

receivers:
  - name: slack-warnings
    slack_configs: [{ channel: "#ml-alerts", api_url: "REDACTED" }]
  - name: pagerduty-and-slack
    pagerduty_configs: [{ service_key: "REDACTED" }]
    slack_configs: [{ channel: "#ml-alerts-critical", api_url: "REDACTED" }]
