# Prometheus alert rules for model monitoring.
groups:
  - name: model-drift
    rules:
      - alert: HighDriftDetected
        expr: model_drift_psi > 0.25
        for: 30m
        labels: { severity: warning, team: ml-platform }
        annotations:
          summary: "Significant drift on {{ $labels.feature }} (PSI > 0.25 for 30m)"
          runbook_url: "https://runbooks/model-drift"

      - alert: ModelAccuracyRegression
        expr: model_rolling_accuracy_7d < model_baseline_accuracy - 0.05
        for: 1h
        labels: { severity: critical }
        annotations: { summary: "Rolling 7d accuracy regressed > 5pp" }

      - alert: PredictionClassImbalance
        expr: |
          max by (model) (rate(predictions_total[5m]))
          /
          min by (model) (rate(predictions_total[5m])) > 10
        for: 10m
        labels: { severity: warning }
        annotations: { summary: "Prediction class skew > 10x; possible drift" }

      - alert: ModelDataPipelineStalled
        expr: model_last_inference_seconds > 1800
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "No predictions for 30 minutes — pipeline stalled?" }
