# Training Configuration
data:
  train_path: "data/processed/train.parquet"
  val_path: "data/processed/val.parquet"
  test_path: "data/processed/test.parquet"
  target_column: "churned"
  test_size: 0.2
  val_size: 0.1
  random_state: 42
  stratify: true

features:
  numeric_features:
    - age
    - tenure_months
    - monthly_charges
    - total_charges
    - avg_monthly_gb_download
    - num_support_tickets
    - num_payment_failures
    - num_service_changes
    - total_services
    - avg_charge_per_service
    - days_since_last_payment
    - payment_regularity

  categorical_features:
    - gender
    - region
    - contract_type
    - payment_method
    - internet_service
    - tenure_group

  boolean_features:
    - paperless_billing
    - phone_service
    - multiple_lines
    - online_security
    - online_backup
    - device_protection
    - tech_support
    - streaming_tv
    - streaming_movies
    - is_senior
    - contract_end_approaching

models:
  logistic_regression:
    enabled: true
    params:
      C: 1.0
      max_iter: 1000
      solver: "lbfgs"
      class_weight: "balanced"

  random_forest:
    enabled: true
    params:
      n_estimators: 100
      max_depth: 10
      min_samples_split: 5
      min_samples_leaf: 2
      class_weight: "balanced"
      random_state: 42
      n_jobs: -1

  xgboost:
    enabled: true
    params:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      subsample: 0.8
      colsample_bytree: 0.8
      gamma: 0
      min_child_weight: 1
      scale_pos_weight: 1
      random_state: 42
      n_jobs: -1

  lightgbm:
    enabled: true
    params:
      n_estimators: 100
      max_depth: 6
      learning_rate: 0.1
      num_leaves: 31
      subsample: 0.8
      colsample_bytree: 0.8
      min_child_samples: 20
      class_weight: "balanced"
      random_state: 42
      n_jobs: -1

hyperparameter_optimization:
  enabled: true
  framework: "optuna"
  n_trials: 100
  timeout_seconds: 3600
  n_jobs: 4

  xgboost_search_space:
    max_depth: [3, 4, 5, 6, 7, 8]
    learning_rate: [0.01, 0.05, 0.1, 0.2]
    n_estimators: [100, 200, 300, 500]
    min_child_weight: [1, 3, 5, 7]
    gamma: [0, 0.1, 0.2, 0.3]
    subsample: [0.6, 0.7, 0.8, 0.9, 1.0]
    colsample_bytree: [0.6, 0.7, 0.8, 0.9, 1.0]

  lightgbm_search_space:
    max_depth: [3, 4, 5, 6, 7, 8]
    learning_rate: [0.01, 0.05, 0.1, 0.2]
    n_estimators: [100, 200, 300, 500]
    num_leaves: [15, 31, 63, 127]
    min_child_samples: [10, 20, 30, 50]
    subsample: [0.6, 0.7, 0.8, 0.9, 1.0]
    colsample_bytree: [0.6, 0.7, 0.8, 0.9, 1.0]

evaluation:
  cv_folds: 5
  cv_stratified: true

  metrics:
    - accuracy
    - precision
    - recall
    - f1
    - roc_auc
    - pr_auc

  threshold_tuning:
    enabled: true
    metric: "f1"
    thresholds: [0.3, 0.35, 0.4, 0.45, 0.5, 0.55, 0.6, 0.65, 0.7]

  fairness_metrics:
    enabled: true
    protected_attributes:
      - gender
      - age_group
    metrics:
      - demographic_parity
      - equal_opportunity
      - predictive_parity

mlflow:
  tracking_uri: "${MLFLOW_TRACKING_URI}"
  experiment_name: "${MLFLOW_EXPERIMENT_NAME}"
  run_name_prefix: "churn-training"
  log_models: true
  log_artifacts: true
  register_best_model: true
  model_name: "${MODEL_NAME}"

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "logs/training.log"
